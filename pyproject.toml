[project]
name = "cctrack"
version = "0.1.0"
description = "A no-nonsense budget tracker for CIBC card transactions"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15",
    "matplotlib>=3.9",
    "httpx>=0.28",
    "platformdirs>=4.3",
]
# NOTE: playwright is deliberately NOT listed here. nixpkgs patches its playwright
# python package to point at the exact chromium revision in playwright-driver.browsers
# (1.60.0 -> chromium-1228), while the same version on PyPI expects chromium-1223.
# Installing it from PyPI can never match the nix browser bundle. The devShell
# supplies it instead; see nix/devShell.nix.

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
cctrack = "cctrack.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cctrack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# scripts/ holds one-off diagnostic probes against live CIBC and Beeper. They
# deliberately catch broadly and report, because a probe that crashes tells us
# less than one that prints what went wrong and carries on.
"scripts/*" = ["BLE001"]

