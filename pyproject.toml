[project]
name = "cctrack"
version = "0.1.0"
description = "A no-nonsense budget tracker for CIBC card transactions"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15",
    "playwright>=1.49",
    "matplotlib>=3.9",
    "httpx>=0.28",
    "platformdirs>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
cctrack = "cctrack.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cctrack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
